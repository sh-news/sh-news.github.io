const FL="hl_fl";
function loginScreen(msg){
  document.body.innerHTML='<div class="logn"><div class="panel"><div class="logo" style="font-size:1.6rem;margin-bottom:6px">head<i>line</i></div><div class="sub" style="margin:0 0 18px">Admin console</div><label>Username</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="le"></div><button class="btn" id="lg" style="width:100%;margin-top:8px;justify-content:center">Sign in</button><p class="m" style="margin-top:16px"><a href="../">Back to Headline</a></p></div></div>';
  $("#le").textContent=msg||"";const go=async()=>{
    const u=$("#lu").value.trim().toLowerCase(),p=$("#lp").value,e=$("#le");e.textContent="";if(!/^[a-z0-9_]{3,20}$/.test(u)||!p)return e.textContent="Enter your username and password.";
    let f={};try{f=JSON.parse(localStorage.getItem(FL))||{}}catch(_){}const k=u+"@"+HL.DOMAIN,x=f[k]||{n:0,until:0};if(x.until>Date.now())return e.textContent="Too many wrong attempts. Try again in "+Math.ceil((x.until-Date.now())/60000)+" min.";
    $("#lg").disabled=true;try{await auth.signInWithEmailAndPassword(k,secret(u,p));delete f[k];localStorage.setItem(FL,JSON.stringify(f))}
    catch(err){if(/invalid-credential|wrong-password|user-not-found/.test(err.code)){x.n++;if(x.n>=5){x.until=Date.now()+5*60e3;x.n=0}f[k]=x;try{localStorage.setItem(FL,JSON.stringify(f))}catch(_){}}e.textContent=/invalid-credential|wrong-password|user-not-found/.test(err.code)?"Wrong username or password.":(err.message||"Couldn't sign in.")}
    $("#lg").disabled=false};
  $("#lg").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()}}
async function start(u){
  const name=u.email.split("@")[0];let d;try{const s=await db.collection("users").doc(name).get();d=s.exists?s.data():{}}catch(e){return loginScreen("Couldn't read your account. Check the Firestore rules.")}
  if(!STAFF.includes(d.role)){await auth.signOut();return loginScreen("This account isn't an admin.")}
  if(d.suspended&&norm(d.role)!=="owner"){await auth.signOut();return loginScreen("This account is suspended.")}
  me={name,role:norm(d.role)};unsubs.forEach(f=>f());unsubs=[];
  unsubs.push(db.collection("config").doc("site").onSnapshot(s=>{site=s.exists?s.data():{}},()=>{}));
  await new Promise(res=>{let first=true;unsubs.push(db.collection("config").doc("roles").onSnapshot(s=>{roles=s.exists?s.data():{};if(me.role==="owner"&&!s.exists)db.collection("config").doc("roles").set(DEFR).catch(()=>{});if(first){first=false;res()}else{paintSide()}},()=>res()))});
  unsubs.push(db.collection("users").doc(name).onSnapshot(s=>{const v=s.data()||{};if(v.suspended&&norm(v.role)!=="owner")auth.signOut().then(()=>location.reload())},()=>{}));
  try{if(!sessionStorage.getItem("hl_adm_logged")){sessionStorage.setItem("hl_adm_logged","1");const k="hl_dev_"+name;let known=null;try{known=localStorage.getItem(k);localStorage.setItem(k,"1")}catch(_){}db.collection("adminLogins").add({user:name,role:me.role,at:ts(),newDevice:!known,ua:navigator.userAgent.slice(0,100)}).catch(()=>{})}}catch(_){}
  buildShell();go(location.hash.slice(1)||"overview");
  setInterval(()=>{if(cur==="overview"&&!document.hidden)go("overview")},120000);
  if(me.role==="owner"){const t0=Date.now();unsubs.push(db.collection("adminLogins").orderBy("at","desc").limit(1).onSnapshot(s=>s.docChanges().forEach(c=>{if(c.type!=="added")return;const v=c.doc.data();if(!v.at||v.at.toMillis()<t0-5000||v.user===me.name)return;toast("@"+v.user+" ("+v.role+") signed in"+(v.newDevice?" from a new device":""))}),()=>{}))}}
auth.onAuthStateChanged(u=>{if(u&&u.email&&u.email.endsWith("@"+HL.DOMAIN))start(u);else{unsubs.forEach(f=>f());unsubs=[];me={name:"",role:"user"};loginScreen()}});
})();

</script></body></html>
